<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <style>
        /* 구글 로그인 버튼 스타일 */
        .btn-google {
            background-color: #FFFFFF;
            color: #1f1f1f;
            border: 1px solid #dadce0;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Roboto', sans-serif; /* 구글은 Roboto 폰트 선호 */
            position: relative;
        }
        .btn-google:hover {
            background-color: #f8f9fa;
            border-color: #d2e3fc;
            box-shadow: 0 1px 2px rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }
        /* 구글 로고 이미지 (SVG) */
        .google-icon {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body class="login-body">
<section id="phase1" class="phase active solid-bg" style="display: flex;">
    <div class="container" style="justify-content: center; align-items: center; height: 100%;">
        <div style="text-align: center; width: 100%; max-width: 320px;">
            <div style="margin-bottom: 10px;">
                <img th:src="@{/images/loading_king_logo.png}" style="width: 100px; height: auto;" alt="로고">
            </div>
            <h1 style="margin-bottom: 5px;">LOADING KING</h1>
            <p style="color: var(--text-sub); margin-bottom: 30px;">Logistics Partner App</p>

            <div style="margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 20px;">
                <input type="text" id="loginId" class="input-field" placeholder="ID" value="DRIVER_01">
                <input type="password" id="loginPw" class="input-field" placeholder="PW" value="1234">
                <button class="btn btn-primary" onclick="login()">⚡ 개발자 프리패스 로그인</button>
            </div>

            <a href="/oauth2/authorization/google" class="btn btn-google input-field" style="text-decoration: none; width: 100%; box-sizing: border-box; height: 50px;">
                <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Google 계정으로 시작하기
            </a>
        </div>
    </div>
</section>

<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
