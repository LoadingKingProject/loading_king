<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: commonHead}"></th:block>
    <title>Loading King - 적재의 미학</title>
</head>
<body class="loading-theme-body">

<div class="split-container">
    <div class="visual-section">
        <div class="content-wrapper">
            <div class="logo-text">LOADING KING</div>
            <h1 class="slogan">
                빈틈없는 적재,<br>
                <span class="highlight">완벽한 물류의 시작.</span>
            </h1>

            <div class="loader-container">
                <div class="cube-wrapper">
                    <div class="cube cube1"></div>
                    <div class="cube cube2"></div>
                    <div class="cube cube3"></div>
                    <div class="cube cube4"></div>
                </div>
                <p class="loading-text">Optimizing Space...</p>
            </div>
        </div>
    </div>

    <div class="form-section">
        <div class="login-card">
            <div class="input-group">
                <label>ID</label>
                <input type="text" id="loginId" class="input-field" placeholder="아이디" value="DRIVER_01">
            </div>

            <div class="input-group">
                <label>PASSWORD</label>
                <input type="password" id="loginPw" class="input-field" placeholder="비밀번호" value="1234">
            </div>

            <button class="btn-primary" onclick="login()">
                LOG IN
            </button>

            <div class="dev-pass" onclick="login()">⚡ Dev Quick Pass</div>

            <div class="divider">OR</div>

            <a href="/oauth2/authorization/google" class="btn-google">
                <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Google 계정으로 시작하기
            </a>

            <p class="copyright">© 2026 Loading King System</p>
        </div>
    </div>
</div>

<script th:src="@{/js/api.js}"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
